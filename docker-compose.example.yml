services:
  haushaltsbuch:
    image: ghcr.io/daknoblo/haushaltsbuch:latest
    container_name: haushaltsbuch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Listen address inside the container.
      HB_HTTP_ADDR: ":8080"
      # Directory holding the SQLite database. Must match the volume below.
      HB_DATA_DIR: "/appdata"
      # Log level: debug | info | warn | error.
      HB_LOG_LEVEL: "info"
      # Bearer token of the HTTP API under /api/v1/. Leave it out to keep the
      # API off; the browser UI does not need it.
      # HB_API_TOKEN: "${HB_API_TOKEN}"
      # IANA time zone used for date handling.
      TZ: "Europe/Berlin"
    volumes:
      - haushaltsbuch-data:/appdata
    # Only the data volume needs to be writable.
    read_only: true
    security_opt:
      - no-new-privileges:true
    # The application is single-user and idles at a few MiB of memory.
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  haushaltsbuch-data:
