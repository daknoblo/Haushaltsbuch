name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Verify generated templ code is up to date
        run: |
          go tool templ generate
          git diff --exit-code

      - name: Verify compiled Tailwind CSS is up to date
        run: |
          make tailwind
          make css
          git diff --exit-code -- internal/web/assets/static/app.css

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency review
        # The project stopped publishing a moving major tag after v3, so the
        # patch version is pinned.
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
