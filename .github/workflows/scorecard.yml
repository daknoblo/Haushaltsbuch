# Scores the repository against the OpenSSF checks (branch protection, pinned
# actions, signed releases, ...) and publishes the result to the Security tab.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
